name: Verify

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, intl

      - name: Install workspace dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build

      - name: Verify committed package assets
        run: git diff --exit-code -- packages/jds/public/dist

      - name: Install Blade renderer dependencies
        working-directory: apps/docs/blade
        env:
          COMPOSER_MIRROR_PATH_REPOS: '1'
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Test Blade renderer
        working-directory: apps/docs/blade
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test
