name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  publish-package:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package/package-lock.json

      - name: Build package archive
        run: |
          cd package
          npm ci
          npm run build
          rm -rf node_modules
          cd ..
          zip -qr "jetcar-jds-${GITHUB_REF_NAME}.zip" composer.json README.md package \
            -x 'package/node_modules/*'

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "jetcar-jds-${GITHUB_REF_NAME}.zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "jetcar-jds-${GITHUB_REF_NAME}.zip" --generate-notes
          fi

  publish-docs-image:
    needs: publish-package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jetcar-dev/jds-docs:${{ steps.version.outputs.value }}
            ghcr.io/jetcar-dev/jds-docs:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-docs:
    needs: publish-docs-image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload deployment files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DOCS_APP_KEY: ${{ secrets.DOCS_APP_KEY }}
          VERSION: ${{ needs.publish-docs-image.outputs.version }}
        run: |
          printf 'JDS_DOCS_IMAGE=ghcr.io/jetcar-dev/jds-docs\nJDS_VERSION=%s\nAPP_KEY=%s\n' "$VERSION" "$DOCS_APP_KEY" > /tmp/jds-docs.env
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p /opt/jds-docs'
          scp -P "$DEPLOY_PORT" deploy/compose.yml "$DEPLOY_USER@$DEPLOY_HOST:/opt/jds-docs/compose.yml"
          scp -P "$DEPLOY_PORT" /tmp/jds-docs.env "$DEPLOY_USER@$DEPLOY_HOST:/opt/jds-docs/.env"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'chmod 600 /opt/jds-docs/.env'

      - name: Pull and restart docs
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'cd /opt/jds-docs && docker compose pull && docker compose up -d --remove-orphans'
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8088/up && exit 0; sleep 2; done; docker compose -f /opt/jds-docs/compose.yml logs --tail=100; exit 1'
