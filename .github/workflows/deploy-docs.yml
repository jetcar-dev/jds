name: Deploy Docs

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docs-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  publish-docs-images:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish docs
        uses: docker/build-push-action@v6
        with:
          context: .
          target: docs-runtime
          push: true
          tags: ghcr.io/jetcar-dev/jds-docs:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=docs
          cache-to: type=gha,mode=max,scope=docs

      - name: Build and publish Blade preview
        uses: docker/build-push-action@v6
        with:
          context: .
          target: preview-runtime
          push: true
          tags: ghcr.io/jetcar-dev/jds-docs-preview:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=preview
          cache-to: type=gha,mode=max,scope=preview

  deploy-docs:
    needs: publish-docs-images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload deployment files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DOCS_APP_KEY: ${{ secrets.DOCS_APP_KEY }}
        run: |
          printf 'JDS_DOCS_IMAGE=ghcr.io/jetcar-dev/jds-docs\nJDS_PREVIEW_IMAGE=ghcr.io/jetcar-dev/jds-docs-preview\nJDS_DEPLOY_TAG=sha-%s\nAPP_KEY=%s\n' "$GITHUB_SHA" "$DOCS_APP_KEY" > /tmp/jds-docs.env
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p /opt/jds-docs'
          scp -P "$DEPLOY_PORT" deploy/compose.yml "$DEPLOY_USER@$DEPLOY_HOST:/opt/jds-docs/compose.yml"
          scp -P "$DEPLOY_PORT" /tmp/jds-docs.env "$DEPLOY_USER@$DEPLOY_HOST:/opt/jds-docs/.env"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'chmod 600 /opt/jds-docs/.env'

      - name: Pull and restart docs
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'cd /opt/jds-docs && docker compose pull && docker compose up -d --remove-orphans'
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'docker logout ghcr.io'
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8088/up && exit 0; sleep 2; done; docker compose -f /opt/jds-docs/compose.yml logs --tail=100; exit 1'
