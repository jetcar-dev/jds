services:
  docs:
    image: ${JDS_DOCS_IMAGE:-ghcr.io/jetcar-dev/jds-docs}:${JDS_VERSION:-latest}
    restart: unless-stopped
    pull_policy: always
    ports:
      - "127.0.0.1:8088:80"
    environment:
      APP_NAME: JDS Docs
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://jetcarerp.cafe24.com:9445
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
