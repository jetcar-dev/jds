server {
    listen 9445 ssl http2;
    listen [::]:9445 ssl http2;

    server_name jetcarerp.cafe24.com;

    ssl_certificate /etc/letsencrypt/live/jetcarerp.cafe24.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jetcarerp.cafe24.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        allow 183.107.55.234/32;
        deny all;

        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 9445;
    }
}
