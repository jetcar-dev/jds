<button type="button" class="playground-toggle" aria-label="버튼 설정" aria-expanded="false" aria-controls="button-playground">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
        <path d="M3 8h6m5 0h7M3 16h9m5 0h4" />
        <circle cx="11.5" cy="8" r="2.5" />
        <circle cx="14.5" cy="16" r="2.5" />
    </svg>
</button>

<form id="button-playground" data-demo-playground hidden>
    <button type="reset" class="playground-reset" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 11a8 8 0 1 1 2.3 6M4 5v6h6" />
        </svg>
        Reset
    </button>

    <div class="playground-field">
        <label for="example-variant">variant</label>
        <select id="example-variant" name="variant">
            <option>primary</option><option>secondary</option><option>tertiary</option>
            <option>outline</option><option>ghost</option><option>danger</option><option>danger-soft</option>
        </select>
    </div>

    <fieldset class="playground-size">
        <legend>size</legend>
        <div class="playground-segments">
            <label><input type="radio" name="size" value="sm">sm</label>
            <label><input type="radio" name="size" value="md" checked>md</label>
            <label><input type="radio" name="size" value="lg">lg</label>
        </div>
    </fieldset>

    <div class="playground-states">
        <label>isDisabled <input type="checkbox" role="switch" name="isDisabled"></label>
        <label>isPending <input type="checkbox" role="switch" name="isPending"></label>
        <label>fullWidth <input type="checkbox" role="switch" name="fullWidth"></label>
    </div>
</form>

<script>
    const exampleControl = document.querySelector('[data-demo-playground]');
    const exampleToggle = document.querySelector('.playground-toggle');
    const exampleButton = document.querySelector('.jds-button');
    const controls = exampleControl.elements;

    function setPlaygroundOpen(open) {
        exampleControl.hidden = !open;
        exampleToggle.setAttribute('aria-expanded', String(open));
    }

    function syncExample() {
        const variant = controls.namedItem('variant');
        const size = controls.namedItem('size');
        for (const option of variant.options) {
            exampleButton.classList.toggle('jds-button--' + option.value, variant.value === option.value);
        }
        for (const option of size) {
            exampleButton.classList.toggle('jds-button--' + option.value, option.checked);
        }
        const pending = controls.namedItem('isPending').checked;
        const fullWidth = controls.namedItem('fullWidth').checked;
        exampleButton.disabled = controls.namedItem('isDisabled').checked;
        if (exampleButton.disabled) exampleButton.setAttribute('data-disabled', 'true');
        else exampleButton.removeAttribute('data-disabled');
        exampleButton.isPending = pending;
        exampleButton.classList.toggle('jds-button--full-width', fullWidth);
        exampleControl.querySelector('[type="reset"]').disabled =
            variant.value === 'primary' && size.value === 'md' && !exampleButton.disabled && !pending && !fullWidth;
    }

    exampleToggle.addEventListener('click', () => setPlaygroundOpen(exampleControl.hidden));
    exampleControl.addEventListener('change', syncExample);
    exampleControl.addEventListener('reset', () => requestAnimationFrame(syncExample));
    document.addEventListener('keydown', (event) => {
        if (event.key !== 'Escape' || exampleControl.hidden) return;
        setPlaygroundOpen(false);
        exampleToggle.focus();
    });
</script>
